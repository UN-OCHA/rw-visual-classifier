[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-visual-classifier"
version = "0.1.0"
description = "Classify ReliefWeb document previews as Map, Infographic, or Other"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "onnxscript>=0.2",
  "pandas>=2.2",
  "Pillow>=10.4",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "timm>=1.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rwvc-build-dataset = "rw_visual_classifier.dataset_build:main"
rwvc-train = "rw_visual_classifier.train:main"
rwvc-evaluate = "rw_visual_classifier.evaluate:main"
rwvc-export = "rw_visual_classifier.export_onnx:main"
rwvc-predict = "rw_visual_classifier.predict:main"
rwvc-review-failures = "rw_visual_classifier.review_failures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
